<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animation Page</title>
<style>
  body{
    margin:0;overflow:hidden;
    background:#000;display:flex;align-items:center;justify-content:center;
    height:100vh;
  }
  video{
    width:100%;height:100%;object-fit:contain;
  }
  .back{
    position:absolute;top:20px;left:20px;
    padding:10px 18px;background:rgba(255,255,255,0.8);
    border:none;border-radius:8px;font-weight:600;
    cursor:pointer;
  }
</style>
</head>
<body>
  <video id="vid" autoplay loop></video>
  <button class="back" onclick="goBack()">Back to Login</button>
  <audio id="bgSound" src="sound.mp3" autoplay loop></audio>

<script>
const params = new URLSearchParams(window.location.search);
const videoFile = params.get('video') || 'default.mp4';
document.getElementById('vid').src = videoFile;

function goBack(){
  window.location.href = 'login.html';
}
</script>
</body>
</html>
